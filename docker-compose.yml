version: '3.8'

services:
    trip-database:
        image: postgres:17.2-bookworm
        container_name: manager-task
        restart: on-failure
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: 1234
            POSTGRES_DB: manager-task
        ports:
            - '5434:5432'

